<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found dApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        #particles-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        
        .dark #particles-bg {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Section Transitions */
        .page-section {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page-section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Satisfying Animated Buttons */
        .btn-animated {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 1;
        }
        .btn-animated::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s ease;
            z-index: -1;
        }
        .btn-animated:hover::before {
            left: 100%;
        }
        .btn-animated:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -10px rgba(0,0,0,0.5);
        }
        .btn-animated:active {
            transform: translateY(1px);
        }

        /* Input styling */
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #cbd5e1;
            background: white;
            color: #1e293b;
            transition: all 0.3s;
        }
        .input-field:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }
        .dark .input-field {
            background: #0f172a;
            border-color: #334155;
            color: #f8fafc;
        }
        .dark .input-field:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
        }
    </style>
</head>
<body onload="generatePublicCode()">

    <h1>Lost & Found dApp</h1>
    
    <button onclick="connectWallet()">Connect Wallet</button>
    <p id="walletAddress">Wallet: Not connected</p>

    <hr>

    <!-- 1. Register Item -->
    <h2>1. Register Item</h2>
    <label>Public Code (Auto-generated):</label><br>
    <input type="text" id="regPublicCode" readonly><br>
    <button onclick="generatePublicCode()">Generate New Code</button><br><br>

    <input type="text" id="regName" placeholder="Item Name (e.g., Blue Backpack)"><br><br>
    <input type="text" id="regSecretCode" placeholder="Secret Code (Keep private)"><br><br>
    <button onclick="registerItem()">Register Item</button>

    <hr>

    <!-- 2. Report Found -->
    <h2>2. Report Item Found</h2>
    <input type="text" id="foundPublicCode" placeholder="Public Code"><br><br>
    <input type="text" id="foundLocation" placeholder="Location Name (e.g., Central Park)"><br><br>
    <input type="text" id="foundLat" placeholder="Latitude (e.g., 40.785091)"><br><br>
    <input type="text" id="foundLng" placeholder="Longitude (e.g., -73.968285)"><br><br>
    <input type="text" id="foundContact" placeholder="Optional Contact (e.g., @finder)"><br><br>
    <button onclick="reportFound()">Report Found</button>

    <hr>

    <!-- 3. Claim & Reset -->
    <h2>3. Claim & Reset (Owner)</h2>
    <input type="text" id="claimPublicCode" placeholder="Public Code"><br><br>
    <input type="text" id="claimSecretCode" placeholder="Your Secret Code"><br><br>
    <button onclick="claimItem()">Claim & Reset Tag</button>

    <!-- JavaScript Logic -->
    <script>
        let provider, signer, contract;

        // Replace with your deployed contract address
        const contractAddress = "0xf29614100602bEbc020B752285725Eb5bF4decb7";

        // Contract ABI matching the LostAndFoundStreamlined smart contract
        const contractABI = [
            "function registerItem(string publicCode, string name, bytes32 secretHash) external",
            "function reportFound(string publicCode, string locationName, uint32 lat, uint32 lng, string contact) external",
            "function claimItemAndReset(string publicCode, string secretCode) external",
            "function getItem(string publicCode) external view returns (tuple(bytes32 secretHash, address owner, address finder, uint8 status, uint32 lat, uint32 lng, uint64 registeredAt, uint64 foundAt, string publicCode, string name, string foundLocationName, string finderContact))",
            "function getOwnerCodes(address owner) external view returns (string[] memory)"
        ];

        // Helper to generate random strings
        function generateRandomString(length) {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let result = "";
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // 1. Connect Wallet & Automatically Load Owner Items
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    signer = await provider.getSigner();
                    contract = new ethers.Contract(contractAddress, contractABI, signer);
                    
                    const address = await signer.getAddress();
                    document.getElementById("walletAddress").innerText = "Wallet: " + address;
                    console.log("Connected to wallet:", address);
                } catch (err) {
                    console.error("User denied wallet connection:", err);
                }
            } else {
                alert("Please install MetaMask or another Web3 wallet!");
            }
        }

        // Load items belonging to the connected wallet
        async function loadOwnerItems() {
            if (!contract) return;
            try {
                const address = await signer.getAddress();
                const codes = await contract.getOwnerCodes(address);
                const listElement = document.getElementById("ownerItemsList");
                listElement.innerHTML = "";

                if (codes.length === 0) {
                    listElement.innerHTML = "<li>No items registered yet.</li>";
                    return;
                }

                for (let code of codes) {
                    const item = await contract.getItem(code);
                    const statusText = item.status === 0n ? "Registered (Safe)" : "Found 🚨";
                    
                    let itemDetails = `<li><b>${item.name}</b> | Public Code: <code>${code}</code> | Status: ${statusText}`;
                    if (item.status === 1n) {
                        itemDetails += `<br>&nbsp;&nbsp;📍 Location: ${item.foundLocationName} (Lat: ${Number(item.lat)/1000000}, Lng: ${Number(item.lng)/1000000})`;
                    }
                    itemDetails += `</li><br>`;
                    listElement.innerHTML += itemDetails;
                }
            } catch (err) {
                console.error("Error loading items:", err);
            }
        }

        // 2. Register Item (Auto-generates Public & Secret Codes)
        async function registerItem() {
            if (!contract) {
                alert("Please connect your wallet first!");
                return;
            }

            const name = document.getElementById("regName").value;
            if (!name) {
                alert("Please enter an item name.");
                return;
            }

            // Automatically generate codes
            const publicCode = "TAG-" + generateRandomString(8); // e.g. TAG-A9B2X4Y1
            const secretCode = "sec_" + generateRandomString(12); // e.g. sec_K3M9P2L5

            try {
                const ownerAddress = await signer.getAddress();

                // Match contract hashing: keccak256(abi.encode(publicCode, secretCode, owner))
                const encoded = ethers.AbiCoder.defaultAbiCoder().encode(
                    ["string", "string", "address"],
                    [publicCode, secretCode, ownerAddress]
                );
                const secretHash = ethers.keccak256(encoded);

                const tx = await contract.registerItem(publicCode, name, secretHash);
                document.getElementById("regResult").innerText = "Transaction pending...";
                
                await tx.wait();
                alert("Item registered successfully! Public Code: " + publicCode);
            } catch (err) {
                console.error(err);
                document.getElementById("regResult").innerText = "";
                alert("Error: " + (err.reason || err.message));
            }
        }

        // 3. Report Found (GPS Scaling by 1,000,000)
        async function reportFound() {
            if (!contract) {
                alert("Please connect your wallet first!");
                return;
            }

            const publicCode = document.getElementById("foundPublicCode").value;
            const locationName = document.getElementById("foundLocation").value;
            const latFloat = parseFloat(document.getElementById("foundLat").value);
            const lngFloat = parseFloat(document.getElementById("foundLng").value);
            const contact = document.getElementById("foundContact").value || "";

            if (!publicCode || !locationName || isNaN(latFloat) || isNaN(lngFloat)) {
                alert("Please provide a valid public code, location name, and coordinates.");
                return;
            }

            const lat = Math.round(latFloat * 1000000);
            const lng = Math.round(lngFloat * 1000000);

            try {
                const tx = await contract.reportFound(publicCode, locationName, lat, lng, contact);
                await tx.wait();
                alert("Item reported found!");
            } catch (err) {
                console.error(err);
                alert("Error: " + (err.reason || err.message));
            }
        }

        // 4. Claim & Reset Tag
        async function claimItem() {
            if (!contract) {
                alert("Please connect your wallet first!");
                return;
            }

            const publicCode = document.getElementById("claimPublicCode").value;
            const secretCode = document.getElementById("claimSecretCode").value;

            if (!publicCode || !secretCode) {
                alert("Please provide both the public code and your secret code.");
                return;
            }

            try {
                const tx = await contract.claimItemAndReset(publicCode, secretCode);
                await tx.wait();
                alert("Item claimed successfully and tag reset for future use!");
                loadOwnerItems();
            } catch (err) {
                console.error(err);
                alert("Error: " + (err.reason || err.message));
            }
        }
    </script>
</body>
</html>
